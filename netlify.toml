[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Le fichier de mise à jour hors ligne ne doit jamais rester en cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Site d'une seule page : toutes les adresses renvoient à l'application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
